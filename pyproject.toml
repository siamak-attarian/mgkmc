[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mgkmc"
version = "0.1.0"
description = "Mesoscale kinetic Monte Carlo and athermal quasi-static simulation of plasticity in metallic glasses, with an FFT-based spectral equilibrium solver"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Siamak Attarian", email = "siamak.attarian@gmail.com" },
]
keywords = [
    "metallic glass",
    "shear transformation zone",
    "kinetic Monte Carlo",
    "FFT homogenization",
    "micromechanics",
    "plasticity",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "meshio",
    "pyfftw",
    "h5py",
    "numba",
    "pyyaml",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/siamak-attarian/mgkmc"
Documentation = "https://mgkmc.readthedocs.io/"
Repository = "https://github.com/siamak-attarian/mgkmc"
Issues = "https://github.com/siamak-attarian/mgkmc/issues"

[tool.setuptools.packages.find]
include = ["mgkmc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
