simulation_type: "linear_elastic"

system:
  dimensionality: "3d"
  strain_assumption: "finite_strain"
  nx: 16
  ny: 16
  nz: 16
  pixel: 1.0

material:
  E:
    mode: "constant"
    value: 70.0   # GPa
  nu:
    mode: "constant"
    value: 0.3

loading:
  eps_target: 0.08
  step_size: 1e-3

boundary_conditions:
  driving_component: "xx"
  mixed_targets:
    yy: 0.0
    zz: 0.0
  mixed_tol: 1.0  # MPa

output:
  directory: "output_finite_strain"
  duplicate_directory_action: "delete"
  checkpoint_interval: "none"
  vtk_interval: 40
  enable_summary_log: true
  enable_global_log: true
  enable_console: false
