seed: 1
simulation_type: "linear_elastic"

system:
  dimensionality: "2d"
  plane_mode: "plane_stress"
  nx: 128
  ny: 128
  pixel: 0.7

material:
  mu:
    mode: "generated"
    parameters:
      mean: 25
      std: 5.0
      corr: 10
      clip_min: 5
      
  lambda:
    mode: "constant"
    value: 81

loading:
  eps_target: 0.08
  step_size: 1e-4

boundary_conditions:
  driving_component: "xx"
  mixed_targets:
    yy: 0.0
  mixed_tol: 1.0

output:
  directory: "output_plane_stress_2d_heterogenous_nonaffine"
  duplicate_directory_action: "delete"
  checkpoint_interval: "none"
  vtk_interval: "100"
  enable_summary_log: true
  enable_global_log: true
  enable_console: false